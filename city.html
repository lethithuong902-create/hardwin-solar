<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hardwin · Open City</title>
<link rel="icon" href="/favicon.png?v=6" type="image/png">
<link rel="apple-touch-icon" href="/favicon.png?v=6">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#12202e;font-family:system-ui,sans-serif;color:#e8eef8;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.back{position:fixed;left:10px;top:10px;z-index:50;font:600 12px system-ui;color:#38bdf8;text-decoration:none;background:rgba(8,14,28,.92);padding:7px 12px;border-radius:8px;border:1px solid rgba(148,163,184,.35)}
#top{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:8px;pointer-events:none}
#top img{width:36px;height:36px;border-radius:50%;border:1px solid rgba(56,189,248,.5)}
#top .brand{font-size:10px;letter-spacing:.2em;color:#38bdf8}
#hud{position:fixed;left:12px;top:52px;z-index:40;background:rgba(8,14,28,.92);border:1px solid rgba(148,163,184,.3);border-radius:12px;padding:10px 12px;min-width:160px;font-size:12px}
#hpWrap,#hpNpc{height:9px;background:rgba(255,255,255,.1);border-radius:5px;margin-top:6px;overflow:hidden}
#hpBar{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:5px}
#hpBar.mid{background:linear-gradient(90deg,#eab308,#fbbf24)}
#hpBar.low{background:linear-gradient(90deg,#ef4444,#f87171)}
#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid rgba(255,255,255,.7);border-radius:50%;z-index:25;pointer-events:none}
#joyZone{position:fixed;left:18px;bottom:22px;z-index:45;width:128px;height:128px}
#joyBase{width:128px;height:128px;border-radius:50%;background:rgba(15,23,42,.55);border:2px solid rgba(148,163,184,.4);position:relative}
#joyKnob{width:52px;height:52px;border-radius:50%;background:rgba(56,189,248,.9);border:2px solid #fff;position:absolute;left:38px;top:38px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#btns{position:fixed;right:14px;bottom:22px;z-index:45;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
#btns button,#menuBtn{width:58px;height:58px;border-radius:50%;border:2px solid rgba(148,163,184,.45);background:rgba(15,23,42,.8);color:#fff;font-size:12px;font-weight:700;cursor:pointer}
#btnJump{background:rgba(34,197,94,.4)}
#btnShoot{background:rgba(239,68,68,.45);border-color:rgba(248,113,113,.7);width:68px;height:68px;font-size:14px}
#btnCar{background:rgba(56,189,248,.35)}
#menuBtn{position:fixed;right:14px;top:12px;z-index:50}
#menu{display:none;position:fixed;right:14px;top:78px;z-index:55;width:min(260px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:rgba(8,14,28,.95);border:1px solid rgba(148,163,184,.35);border-radius:14px;padding:12px}
#menu.open{display:block}
#menu h4{font-size:11px;letter-spacing:.08em;color:#8fa3c2;margin:8px 0 6px;text-transform:uppercase}
#menu .w{display:block;width:100%;text-align:left;margin:4px 0;padding:10px;border-radius:10px;border:1px solid rgba(148,163,184,.25);background:rgba(30,41,59,.7);color:#e8eef8;font-size:13px;cursor:pointer}
#menu .w.on{border-color:#38bdf8;background:rgba(56,189,248,.2)}
#prompt{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);z-index:40;background:rgba(8,14,28,.9);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
#prompt.show{opacity:1}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:60;background:rgba(8,14,28,.95);padding:14px 20px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<a class="back" href="/">← Hardwin</a>
<button type="button" id="menuBtn">☰</button>
<div id="menu">
  <h4>Vũ khí</h4>
  <button type="button" class="w on" data-gun="pistol">🔫 Pistol Hardwin</button>
  <button type="button" class="w" data-gun="smg">⚡ SMG Plasma</button>
  <button type="button" class="w" data-gun="rifle">🎯 Rifle Sniper</button>
  <button type="button" class="w" data-gun="rail">💫 Railgun Nova</button>
  <h4>Gợi ý</h4>
  <div style="font-size:12px;opacity:.8;line-height:1.45">E: vào/ra tòa nhà · F: lên xe · Chuột trái / nút Bắn · Joystick di chuyển</div>
</div>
<div id="top"><img src="/favicon.png?v=6" alt="H"><div class="brand">HARDWIN · OPEN CITY</div></div>
<div id="hud">
  <div id="mode">🚶 Đi bộ</div>
  <div id="gunLabel">🔫 Pistol</div>
  <div id="spd">0 km/h</div>
  <div style="margin-top:6px;opacity:.85">Máu</div>
  <div id="hpWrap"><div id="hpBar"></div></div>
</div>
<div id="cross"></div>
<div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
<div id="btns">
  <button type="button" id="btnShoot">BẮN</button>
  <button type="button" id="btnCar">🚗</button>
  <button type="button" id="btnJump">⬆</button>
</div>
<div id="prompt">E — Vào tòa nhà</div>
<div id="toast"></div>
<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(function(){
function wait(n){if(typeof THREE!=='undefined'){try{start();}catch(e){console.error(e);alert(e.message);}return;}if(n<120)setTimeout(function(){wait(n+1);},100);}
function start(){
var canvas=document.getElementById('c'),W=innerWidth,H=innerHeight;
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(W,H);
var scene=new THREE.Scene();scene.background=new THREE.Color(0x4a9fd4);scene.fog=new THREE.Fog(0x4a9fd4,90,320);
var camera=new THREE.PerspectiveCamera(58,W/H,0.1,500);camera.position.set(0,14,22);
scene.add(new THREE.HemisphereLight(0xcfe9ff,0x3a4455,0.75));
var sun=new THREE.DirectionalLight(0xfff1d0,1.1);sun.position.set(60,90,40);scene.add(sun);
scene.add(new THREE.AmbientLight(0x506070,0.35));
function rnd(a,b){return a+Math.random()*(b-a);}
function mkWin(){var c=document.createElement('canvas');c.width=64;c.height=128;var x=c.getContext('2d');x.fillStyle='#3d4a5c';x.fillRect(0,0,64,128);
for(var y=3;y<124;y+=12)for(var u=3;u<58;u+=11){x.fillStyle=Math.random()>0.3?(Math.random()>0.7?'#fde68a':'#93c5fd'):'#0f172a';x.fillRect(u,y,8,9);}
var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
var winTex=mkWin();
var ground=new THREE.Mesh(new THREE.PlaneGeometry(420,420),new THREE.MeshLambertMaterial({color:0x2a3038}));ground.rotation.x=-Math.PI/2;scene.add(ground);
var i,gx,gz;
for(i=-6;i<=6;i++){
  var rz=new THREE.Mesh(new THREE.PlaneGeometry(18,420),new THREE.MeshLambertMaterial({color:0x171717}));rz.rotation.x=-Math.PI/2;rz.position.set(i*40,0.03,0);scene.add(rz);
  var rx=new THREE.Mesh(new THREE.PlaneGeometry(420,18),new THREE.MeshLambertMaterial({color:0x171717}));rx.rotation.x=-Math.PI/2;rx.position.set(0,0.03,i*40);scene.add(rx);
  var ln=new THREE.Mesh(new THREE.PlaneGeometry(0.3,420),new THREE.MeshBasicMaterial({color:0xfbbf24}));ln.rotation.x=-Math.PI/2;ln.position.set(i*40,0.04,0);scene.add(ln);
}
var buildings=[],enterables=[];
var types=['🏢 Công ty','🍜 Nhà ăn','🎭 Nhà hát','🏨 Khách sạn','🏦 Ngân hàng','🛒 Siêu thị'];
for(gx=-5;gx<=5;gx++)for(gz=-5;gz<=5;gz++){
  if(Math.abs(gx)+Math.abs(gz)<1)continue;
  if(Math.random()<0.1)continue;
  var h=rnd(14,48),bw=rnd(12,20),bd=rnd(12,20);
  var mat=new THREE.MeshLambertMaterial({map:winTex.clone(),color:new THREE.Color().setHSL(rnd(0.5,0.65),0.1,rnd(0.4,0.6))});
  mat.map.repeat.set(Math.max(1,bw/3),Math.max(2,h/5));
  var mesh=new THREE.Mesh(new THREE.BoxGeometry(bw,h,bd),mat);
  var px=gx*40+rnd(-5,5),pz=gz*40+rnd(-5,5);
  mesh.position.set(px,h/2,pz);scene.add(mesh);
  var roof=new THREE.Mesh(new THREE.BoxGeometry(bw*1.04,0.5,bd*1.04),new THREE.MeshLambertMaterial({color:0x0f172a}));
  roof.position.set(px,h+0.25,pz);scene.add(roof);
  // door marker
  var door=new THREE.Mesh(new THREE.BoxGeometry(2.2,3,0.3),new THREE.MeshLambertMaterial({color:0x1e293b}));
  door.position.set(px,1.5,pz+bd/2+0.1);scene.add(door);
  var b={x:px,z:pz,w:bw,d:bd,h:h,name:types[(gx*7+gz*3+20)%types.length],doorZ:pz+bd/2};
  buildings.push(b);
  if(Math.random()>0.35)enterables.push(b);
}
function tree(x,z){var g=new THREE.Group();g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.25,1.5,6),new THREE.MeshLambertMaterial({color:0x6b4423})),{position:new THREE.Vector3(0,0.75,0)}));
var L=new THREE.Mesh(new THREE.SphereGeometry(1.3,8,6),new THREE.MeshLambertMaterial({color:0x228b45}));L.position.y=2.2;g.add(L);g.position.set(x,0,z);scene.add(g);}
for(i=0;i<50;i++)tree(rnd(-160,160),rnd(-160,160));
function makePerson(skin,shirt,pants,isP){
  var g=new THREE.Group();var sk=new THREE.MeshLambertMaterial({color:skin}),sh=new THREE.MeshLambertMaterial({color:shirt}),pa=new THREE.MeshLambertMaterial({color:pants});
  var head=new THREE.Mesh(new THREE.SphereGeometry(0.23,12,10),sk);head.position.y=1.58;g.add(head);
  var hair=new THREE.Mesh(new THREE.SphereGeometry(0.24,8,6),new THREE.MeshLambertMaterial({color:isP?0x0f2744:0x2a1810}));hair.position.y=1.72;hair.scale.set(1,0.55,1);g.add(hair);
  var torso=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.58,0.3),sh);torso.position.y=1.05;g.add(torso);
  var hips=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.28,0.28),pa);hips.position.y=0.66;g.add(hips);
  var legL=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.58,0.17),pa);legL.position.set(-0.12,0.28,0);g.add(legL);
  var legR=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.58,0.17),pa);legR.position.set(0.12,0.28,0);g.add(legR);
  var armL=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.52,0.13),sh);armL.position.set(-0.32,1.0,0);g.add(armL);
  var armR=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.52,0.13),sh);armR.position.set(0.32,1.0,0);g.add(armR);
  // simple gun on right hand for player
  var gun=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.1,0.45),new THREE.MeshLambertMaterial({color:0x222222}));
  gun.position.set(0.32,1.0,0.35);g.add(gun);
  g.userData={legL:legL,legR:legR,armL:armL,armR:armR,gun:gun};
  return g;
}
function walkAnim(g,t,mv){var a=mv?Math.sin(t*11)*0.5:0;g.userData.legL.rotation.x=a;g.userData.legR.rotation.x=-a;g.userData.armL.rotation.x=-a*0.6;g.userData.armR.rotation.x=a*0.6;}
// cars: sedan + sport (lambo-ish)
var cars=[];
function addCar(x,z,kind){
  var g=new THREE.Group();var col=kind==='lambo'?[0xffd700,0xff2d2d,0x111111,0x00e5ff][Math.floor(Math.random()*4)]:[0xe74c3c,0x3498db,0x2ecc71,0xffffff,0x9b59b6][Math.floor(Math.random()*5)];
  if(kind==='lambo'){
    var body=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.4,4.6),new THREE.MeshLambertMaterial({color:col}));body.position.y=0.45;g.add(body);
    var slope=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.35,2.2),new THREE.MeshLambertMaterial({color:col}));slope.position.set(0,0.75,-0.3);g.add(slope);
    var glass=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.25,1.4),new THREE.MeshLambertMaterial({color:0x88ccee,transparent:true,opacity:0.7}));glass.position.set(0,0.95,-0.2);g.add(glass);
  }else{
    var body=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.5,4.0),new THREE.MeshLambertMaterial({color:col}));body.position.y=0.48;g.add(body);
    var cab=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.5,2.0),new THREE.MeshLambertMaterial({color:0x87ceeb,transparent:true,opacity:0.75}));cab.position.set(0,1.0,-0.1);g.add(cab);
  }
  var wMat=new THREE.MeshLambertMaterial({color:0x111});
  [[-0.95,0.28,1.3],[0.95,0.28,1.3],[-0.95,0.28,-1.3],[0.95,0.28,-1.3]].forEach(function(p){var w=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.22,10),wMat);w.rotation.z=Math.PI/2;w.position.set(p[0],p[1],p[2]);g.add(w);});
  g.position.set(x,0,z);scene.add(g);
  cars.push({g:g,spd:kind==='lambo'?rnd(10,16):rnd(5,11),dir:Math.random()>0.5?1:-1,ax:Math.random()>0.5?'x':'z',kind:kind,hp:kind==='lambo'?200:100});
}
for(i=0;i<12;i++)addCar(rnd(-140,140),rnd(-140,140),'sedan');
for(i=0;i<6;i++)addCar(rnd(-140,140),rnd(-140,140),'lambo');
var npcs=[],skins=[0xf5c6a0,0xd4a574,0xc68642,0x8d5524],shirts=[0x3b82f6,0xef4444,0x22c55e,0xa855f7,0xf59e0b],pants=[0x1e3a5f,0x374151];
for(i=0;i<16;i++){
  var p=makePerson(skins[i%4],shirts[i%5],pants[i%2],false);
  p.position.set(rnd(-110,110),0,rnd(-110,110));scene.add(p);
  npcs.push({g:p,a:rnd(0,6.28),s:rnd(1.2,2.6),hp:100,dead:false,aggro:false,shootCD:0,face:0});
}
var player=makePerson(0xf5c6a0,0x38bdf8,0x0f2744,true);player.position.set(0,0,14);scene.add(player);
// interior world (simple)
var interior=new THREE.Group();interior.visible=false;scene.add(interior);
var intFloor=new THREE.Mesh(new THREE.BoxGeometry(16,0.3,16),new THREE.MeshLambertMaterial({color:0x8b6914}));intFloor.position.y=0.15;interior.add(intFloor);
var intWall=new THREE.Mesh(new THREE.BoxGeometry(16,6,0.4),new THREE.MeshLambertMaterial({color:0xe2e8f0}));intWall.position.set(0,3,-8);interior.add(intWall);
var intWall2=intWall.clone();intWall2.position.set(0,3,8);interior.add(intWall2);
var intWall3=new THREE.Mesh(new THREE.BoxGeometry(0.4,6,16),new THREE.MeshLambertMaterial({color:0xcbd5e1}));intWall3.position.set(-8,3,0);interior.add(intWall3);
var intWall4=intWall3.clone();intWall4.position.set(8,3,0);interior.add(intWall4);
var intLight=new THREE.PointLight(0xfff5e0,1,25);intLight.position.set(0,5,0);interior.add(intLight);
var intLabel=null;
// weapons
var GUNS={pistol:{name:'Pistol Hardwin',dmg:22,cd:0.28,spd:55,color:0xffee88,spread:0.02},
smg:{name:'SMG Plasma',dmg:12,cd:0.09,spd:50,color:0x44ffaa,spread:0.06},
rifle:{name:'Rifle Sniper',dmg:55,cd:0.7,spd:90,color:0xff6666,spread:0.005},
rail:{name:'Railgun Nova',dmg:90,cd:1.1,spd:120,color:0xaa66ff,spread:0.0}};
var gun='pistol',bullets=[],shootCD=0;
var hp=100,maxHp=100,dead=false,inCar=false,carRef=null,vy=0,onGround=true,inside=false,insideB=null,outsidePos=new THREE.Vector3();
var joy={x:0,y:0,active:false},keys={},camYaw=0,pitch=0.4,faceYaw=0,walkT=0;
function setKey(c,o){keys[c]=!!o;}
window.addEventListener('keydown',function(e){setKey(e.code,true);if(e.code==='Space'||e.code.indexOf('Arrow')===0)e.preventDefault();if(e.code==='KeyF')toggleCar();if(e.code==='KeyE')tryEnter();});
window.addEventListener('keyup',function(e){setKey(e.code,false);});
// menu
document.getElementById('menuBtn').onclick=function(){document.getElementById('menu').classList.toggle('open');};
document.querySelectorAll('#menu .w').forEach(function(b){b.onclick=function(){gun=b.dataset.gun;document.querySelectorAll('#menu .w').forEach(function(x){x.classList.toggle('on',x===b);});document.getElementById('gunLabel').textContent='🔫 '+GUNS[gun].name;document.getElementById('menu').classList.remove('open');toast(GUNS[gun].name);};});
// joystick
var joyBase=document.getElementById('joyBase'),joyKnob=document.getElementById('joyKnob'),joyZone=document.getElementById('joyZone');
function joyUpd(cx,cy){var r=joyBase.getBoundingClientRect();var mx=cx-(r.left+r.width/2),my=cy-(r.top+r.height/2);var max=46,len=Math.sqrt(mx*mx+my*my)||1;if(len>max){mx*=max/len;my*=max/len;}joyKnob.style.left=(38+mx)+'px';joyKnob.style.top=(38+my)+'px';joy.x=mx/max;joy.y=-my/max;}
function joyEnd(){joy.active=false;joy.x=0;joy.y=0;joyKnob.style.left='38px';joyKnob.style.top='38px';}
joyZone.addEventListener('pointerdown',function(e){joy.active=true;joyUpd(e.clientX,e.clientY);joyZone.setPointerCapture(e.pointerId);e.preventDefault();});
joyZone.addEventListener('pointermove',function(e){if(joy.active)joyUpd(e.clientX,e.clientY);});
joyZone.addEventListener('pointerup',joyEnd);joyZone.addEventListener('pointercancel',joyEnd);
document.getElementById('btnJump').addEventListener('pointerdown',function(e){e.preventDefault();setKey('Space',true);});
document.getElementById('btnJump').addEventListener('pointerup',function(){setKey('Space',false);});
document.getElementById('btnCar').onclick=function(e){e.preventDefault();toggleCar();};
document.getElementById('btnShoot').addEventListener('pointerdown',function(e){e.preventDefault();setKey('Shoot',true);});
document.getElementById('btnShoot').addEventListener('pointerup',function(){setKey('Shoot',false);});
window.addEventListener('mousedown',function(e){if(e.button===0&&e.target===canvas)setKey('Shoot',true);});
window.addEventListener('mouseup',function(){setKey('Shoot',false);});
var dragging=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',function(e){dragging=true;lx=e.clientX;ly=e.clientY;try{canvas.setPointerCapture(e.pointerId);}catch(err){}});
canvas.addEventListener('pointerup',function(){dragging=false;});
canvas.addEventListener('pointermove',function(e){if(!dragging)return;var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;camYaw-=dx*0.005;pitch=Math.max(0.15,Math.min(1.25,pitch+dy*0.004));});
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}
function updHp(){var bar=document.getElementById('hpBar'),pct=Math.max(0,hp/maxHp*100);bar.style.width=pct+'%';bar.className=pct<35?'low':pct<65?'mid':'';}
function hurt(amt){if(dead||inCar)return;hp-=amt;if(hp<0)hp=0;updHp();if(hp<=0){dead=true;toast('💀 Bạn đã chết');setTimeout(respawn,2200);}}
function respawn(){dead=false;hp=maxHp;updHp();if(inside)exitBuilding();player.position.set(0,0,14);player.visible=true;toast('Hồi sinh');}
function toggleCar(){if(dead||inside)return;if(inCar){inCar=false;carRef=null;player.visible=true;document.getElementById('mode').textContent='🚶 Đi bộ';return;}
var best=null,bd=4;for(var ci=0;ci<cars.length;ci++){var d=player.position.distanceTo(cars[ci].g.position);if(d<bd){bd=d;best=cars[ci];}}
if(best){inCar=true;carRef=best;player.visible=false;document.getElementById('mode').textContent='🚗 '+(best.kind==='lambo'?'Lamborghini':'Xe');toast('Đã lên xe');}else toast('Lại gần xe');}
function nearEnterable(){if(inside||inCar)return null;var best=null,bd=5;
for(var i=0;i<enterables.length;i++){var b=enterables[i];var d=Math.hypot(player.position.x-b.x,player.position.z-(b.doorZ||b.z));if(d<bd){bd=d;best=b;}}return best;}
function tryEnter(){if(inside){exitBuilding();return;}var b=nearEnterable();if(!b)return;
outsidePos.copy(player.position);inside=true;insideB=b;interior.visible=true;
for(var i=0;i<scene.children.length;i++){var ch=scene.children[i];if(ch!==interior&&ch!==player&&ch.type!=='HemisphereLight'&&ch.type!=='DirectionalLight'&&ch.type!=='AmbientLight'&&ch.type!=='PointLight'){/* keep simple: hide city by fog */}}
scene.background=new THREE.Color(0x1a2230);scene.fog=null;
player.position.set(0,0,5);toast('Vào: '+b.name+' · E để ra · Tầng ảo');
document.getElementById('mode').textContent='🏢 '+b.name;}
function exitBuilding(){inside=false;interior.visible=false;scene.background=new THREE.Color(0x4a9fd4);scene.fog=new THREE.Fog(0x4a9fd4,90,320);
player.position.copy(outsidePos);player.position.z+=2;document.getElementById('mode').textContent='🚶 Đi bộ';toast('Ra ngoài');insideB=null;}
function blocked(x,z){if(inside)return Math.abs(x)>7||Math.abs(z)>7;for(var bi=0;bi<buildings.length;bi++){var b=buildings[bi];if(Math.abs(x-b.x)<b.w/2+0.4&&Math.abs(z-b.z)<b.d/2+0.4)return true;}return false;}
function fire(from,dir,isPlayer,gtype){
  var gdef=GUNS[gtype||gun];
  var mesh=new THREE.Mesh(new THREE.SphereGeometry(0.12,6,6),new THREE.MeshBasicMaterial({color:gdef.color}));
  mesh.position.copy(from);scene.add(mesh);
  var d=dir.clone().normalize();
  d.x+=rnd(-gdef.spread,gdef.spread);d.z+=rnd(-gdef.spread,gdef.spread);d.normalize();
  bullets.push({mesh:mesh,vel:d.multiplyScalar(gdef.spd),life:1.8,dmg:gdef.dmg,fromPlayer:!!isPlayer});
}
function playerShoot(){
  if(shootCD>0||dead||inCar)return;
  var gdef=GUNS[gun];shootCD=gdef.cd;
  var origin=player.position.clone();origin.y=1.3;
  var dir=new THREE.Vector3(Math.sin(faceYaw),0,Math.cos(faceYaw));
  fire(origin,dir,true,gun);
}
var clock=new THREE.Clock(),hitCD=0;
function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05);walkT+=dt;hitCD=Math.max(0,hitCD-dt);shootCD=Math.max(0,shootCD-dt);
  var near=nearEnterable();var pr=document.getElementById('prompt');
  if(near&&!inside){pr.textContent='E — Vào '+near.name;pr.classList.add('show');}
  else if(inside){pr.textContent='E — Ra ngoài';pr.classList.add('show');}
  else pr.classList.remove('show');
  if(!dead){
    var fwd=new THREE.Vector3(Math.sin(camYaw),0,Math.cos(camYaw));
    var right=new THREE.Vector3(Math.cos(camYaw),0,-Math.sin(camYaw));
    var sprint=keys.ShiftLeft||keys.ShiftRight;
    var sp=inCar?(sprint?24:14):(sprint?8.5:4.5);
    var mv=new THREE.Vector3();
    if(keys.KeyW||keys.ArrowUp)mv.add(fwd);if(keys.KeyS||keys.ArrowDown)mv.sub(fwd);
    if(keys.KeyA||keys.ArrowLeft)mv.sub(right);if(keys.KeyD||keys.ArrowRight)mv.add(right);
    if(joy.active&&(Math.abs(joy.x)>0.08||Math.abs(joy.y)>0.08)){mv.addScaledVector(fwd,joy.y);mv.addScaledVector(right,joy.x);}
    var moving=mv.lengthSq()>0.0001;
    if(moving){
      mv.normalize();
      faceYaw=Math.atan2(mv.x,mv.z);
      mv.multiplyScalar(sp*dt);
      var nx=player.position.x+mv.x,nz=player.position.z+mv.z;
      if(!blocked(nx,nz)){player.position.x=nx;player.position.z=nz;}
    }
    if(keys.Space&&onGround&&!inCar){vy=8.2;onGround=false;}
    vy-=25*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true;}
    player.rotation.y=faceYaw;
    if(!inCar)walkAnim(player,walkT,moving&&onGround);
    if(inCar&&carRef){carRef.g.position.x=player.position.x;carRef.g.position.z=player.position.z;carRef.g.rotation.y=faceYaw;player.position.y=0;}
    if(keys.Shoot)playerShoot();
    document.getElementById('spd').textContent=Math.round((moving?sp:0)*3.6)+' km/h';
  }
  // bullets
  for(var bi=bullets.length-1;bi>=0;bi--){
    var bu=bullets[bi];bu.life-=dt;bu.mesh.position.addScaledVector(bu.vel,dt);
    if(bu.life<=0){scene.remove(bu.mesh);bullets.splice(bi,1);continue;}
    if(bu.fromPlayer){
      for(var ni=0;ni<npcs.length;ni++){
        var n=npcs[ni];if(n.dead)continue;
        if(bu.mesh.position.distanceTo(n.g.position.clone().setY(1.2))<0.9){
          n.hp-=bu.dmg;n.aggro=true;scene.remove(bu.mesh);bullets.splice(bi,1);
          if(n.hp<=0){n.dead=true;n.g.rotation.z=Math.PI/2;n.g.position.y=0.2;toast('Hạ gục!');}
          break;
        }
      }
    }else{
      if(!dead&&bu.mesh.position.distanceTo(player.position.clone().setY(1.2))<0.85){
        hurt(bu.dmg);scene.remove(bu.mesh);bullets.splice(bi,1);toast('Bị bắn!');
      }
    }
  }
  // cars
  if(!inside)for(i=0;i<cars.length;i++){
    var c=cars[i];if(inCar&&c===carRef)continue;
    if(c.ax==='x'){c.g.position.x+=c.spd*c.dir*dt;if(Math.abs(c.g.position.x)>150)c.dir*=-1;c.g.rotation.y=c.dir>0?-Math.PI/2:Math.PI/2;}
    else{c.g.position.z+=c.spd*c.dir*dt;if(Math.abs(c.g.position.z)>150)c.dir*=-1;c.g.rotation.y=c.dir>0?0:Math.PI;}
    if(!dead&&!inCar&&hitCD<=0&&player.position.distanceTo(c.g.position)<2.3){hurt(Math.min(50,18+c.spd*2));hitCD=1;toast('🚗 Đâm xe!');}
  }
  // npcs AI shoot back
  for(i=0;i<npcs.length;i++){
    var n=npcs[i];if(n.dead)continue;
    n.shootCD=Math.max(0,n.shootCD-dt);
    var toP=player.position.clone().sub(n.g.position);var dist=toP.length();
    if(n.aggro&&dist<45&&!dead){
      n.face=Math.atan2(toP.x,toP.z);n.g.rotation.y=n.face;
      if(dist>8){var step=toP.normalize().multiplyScalar(2.8*dt);n.g.position.x+=step.x;n.g.position.z+=step.z;walkAnim(n.g,walkT+i,true);}
      if(n.shootCD<=0&&dist<35){
        n.shootCD=0.9;var o=n.g.position.clone();o.y=1.3;var d=new THREE.Vector3(Math.sin(n.face),0,Math.cos(n.face));fire(o,d,false,'pistol');
      }
    }else if(!inside){
      n.a+=dt*0.28;n.g.position.x+=Math.cos(n.a)*n.s*dt;n.g.position.z+=Math.sin(n.a)*n.s*dt;
      n.g.rotation.y=-n.a+Math.PI/2;walkAnim(n.g,walkT+i,true);
    }
  }
  // camera
  var dist=inside?8:12,ch=inside?4:5+pitch*5;
  var px=player.position.x,pz=player.position.z,py=player.position.y;
  var cy=inside?faceYaw:camYaw;
  camera.position.x=px-Math.sin(cy)*dist;camera.position.z=pz-Math.cos(cy)*dist;camera.position.y=py+ch;
  camera.lookAt(px,py+1.35,pz);
  renderer.render(scene,camera);
}
updHp();document.getElementById('gunLabel').textContent='🔫 '+GUNS.pistol.name;animate();
window.addEventListener('resize',function(){W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);});
}
wait(0);
})();
</script>
