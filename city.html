<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hardwin · Open City</title>
<link rel="icon" href="/favicon.png?v=6" type="image/png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1520;font-family:system-ui,sans-serif;color:#e8eef8;touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:#4a9fd4}
.back{position:fixed;left:12px;top:max(12px,env(safe-area-inset-top));z-index:60;font:700 13px system-ui;color:#38bdf8;text-decoration:none;background:rgba(8,14,28,.95);padding:10px 14px;border-radius:10px;border:1px solid rgba(56,189,248,.4)}
#top{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:10px;pointer-events:none}
#top img{width:40px;height:40px;border-radius:50%;border:2px solid rgba(56,189,248,.55)}
#top .brand{font-size:11px;letter-spacing:.18em;color:#38bdf8;font-weight:700}
#hud{position:fixed;left:12px;top:max(56px,calc(env(safe-area-inset-top)+48px));z-index:50;background:rgba(8,14,28,.94);border:1px solid rgba(148,163,184,.35);border-radius:14px;padding:12px 14px;min-width:150px;font-size:13px}
#hud .row{margin:3px 0}
#hpWrap{height:12px;background:rgba(255,255,255,.12);border-radius:8px;margin-top:6px;overflow:hidden}
#hpBar{height:100%;width:100%;background:linear-gradient(90deg,#16a34a,#4ade80);border-radius:8px}
#cross{position:fixed;left:50%;top:48%;width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid rgba(255,255,255,.75);border-radius:50%;z-index:20;pointer-events:none}
#joyZone{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));z-index:55;width:140px;height:140px}
#joyBase{width:140px;height:140px;border-radius:50%;background:rgba(15,23,42,.6);border:3px solid rgba(148,163,184,.45);position:relative}
#joyKnob{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#7dd3fc,#0284c7);border:3px solid #fff;position:absolute;left:42px;top:42px}
#btns{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:55;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
#btns button{width:58px;height:58px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(15,23,42,.75);color:#fff;font-size:16px;font-weight:800;cursor:pointer;touch-action:none}
#btnShoot{width:76px;height:76px;background:rgba(220,38,38,.55);border-color:rgba(248,113,113,.8);font-size:14px}
#menuBtn{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:60;width:48px;height:48px;border-radius:12px;border:2px solid rgba(148,163,184,.45);background:rgba(8,14,28,.95);color:#fff;font-size:18px;cursor:pointer}
#menu{display:none;position:fixed;right:max(10px,env(safe-area-inset-right));top:max(64px,calc(env(safe-area-inset-top)+56px));z-index:65;width:min(260px,calc(100vw - 28px));background:rgba(8,14,28,.97);border:1px solid rgba(148,163,184,.4);border-radius:14px;padding:12px;max-height:70vh;overflow:auto}
#menu.open{display:block}
#menu h4{font-size:10px;letter-spacing:.1em;color:#94a3b8;margin:8px 0 6px;text-transform:uppercase}
#menu .w,#menu .hero{display:block;width:100%;text-align:left;margin:4px 0;padding:10px;border-radius:10px;border:1px solid rgba(148,163,184,.25);background:rgba(30,41,59,.8);color:#e8eef8;font-size:12px;cursor:pointer;font-weight:600}
#menu .w.on,#menu .hero.on{border-color:#38bdf8;background:rgba(56,189,248,.22)}
#prompt{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);z-index:45;background:rgba(8,14,28,.92);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;border:1px solid rgba(168,85,247,.5)}
#prompt.show{opacity:1}
#toast{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:70;background:rgba(8,14,28,.96);padding:14px 20px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;text-align:center;font-size:15px;font-weight:600;border:1px solid rgba(148,163,184,.35)}
#toast.show{opacity:1}
#load{position:fixed;inset:0;z-index:100;background:#0b1520;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:14px}
#load.hide{display:none}
</style>
</head>
<body>
<div id="load"><img src="/favicon.png?v=6" width="56" height="56" style="border-radius:50%"><div>Hardwin Open City đang tải…</div></div>
<a class="back" href="/">← Hardwin</a>
<button type="button" id="menuBtn">☰</button>
<div id="menu">
  <h4>Vũ khí (nóc nhà)</h4>
  <button type="button" class="w on" data-gun="pistol">🔫 Súng nhỏ</button>
  <button type="button" class="w" data-gun="smg">⚡ SMG Plasma</button>
  <button type="button" class="w" data-gun="rifle">🎯 Rifle Sniper</button>
  <button type="button" class="w" data-gun="rail">💫 Railgun Nova</button>
  <h4>Nhân vật</h4>
  <button type="button" class="hero on" data-hero="soldier">🎖️ Lính</button>
  <button type="button" class="hero" data-hero="spider">🕸️ Người nhện</button>
  <button type="button" class="hero" data-hero="iron">🤖 Người sắt</button>
  <h4>Điều khiển</h4>
  <div style="font-size:12px;opacity:.85;line-height:1.5">WASD/Joystick · Nhảy · E · G · F xe<br>Nhện: BẮN = tơ · Sắt: click laser · double-click bay</div>
</div>
<div id="top"><img src="/favicon.png?v=6" alt="H"><div class="brand">HARDWIN · OPEN CITY</div></div>
<div id="hud">
  <div class="row" id="mode">Đi bộ</div>
  <div class="row" id="gunLabel">🔫 Súng nhỏ</div>
  <div class="row" id="spd">0 km/h</div>
  <div class="row" style="opacity:.9;margin-top:6px">Máu</div>
  <div id="hpWrap"><div id="hpBar"></div></div>
</div>
<div id="cross"></div>
<div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
<div id="btns">
  <button type="button" id="btnShoot">BẮN</button>
  <button type="button" id="btnEnter">E</button>
  <button type="button" id="btnCar">🚗</button>
  <button type="button" id="btnJump">⬆</button>
</div>
<div id="prompt">E — Nhặt / Vào</div>
<div id="toast"></div>
<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="/city-game.js?v=ok1"></script>
</body>
</html>
