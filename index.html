<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Mặt Trời 3D — Hardwin Solar</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Sora,system-ui,sans-serif;color:#fff}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ui{position:fixed;z-index:10;pointer-events:none}
  .ui *{pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" style="top:12px;left:12px;max-width:280px">
  <div style="background:rgba(0,0,0,.55);padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12)">
    <div style="font-weight:700;font-size:14px">Hardwin Solar</div>
    <div style="font-size:12px;opacity:.8;margin-top:4px">Kéo để xoay · Cuộn để phóng · Nhấp hành tinh để xem thông tin</div>
    <div id="mission" style="font-size:12px;margin-top:8px;opacity:.9">Nhiệm vụ: 0/9</div>
  </div>
</div>
<div id="panel" class="ui" style="display:none;top:12px;right:12px;width:min(320px,92vw)">
  <div style="background:rgba(10,14,28,.88);padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.14)">
    <div id="ptitle" style="font-weight:700;font-size:16px"></div>
    <div id="pbody" style="font-size:12px;line-height:1.55;margin-top:8px;opacity:.92"></div>
    <button id="pclose" style="margin-top:10px;padding:6px 10px;border-radius:8px;border:0;background:#3b82f6;color:#fff;cursor:pointer">Đóng</button>
  </div>
</div>
<script>
(function(){
  const PLANETS=[
    {name:'Mặt Trời',color:0xffcc33,size:6.5,dist:0,info:'Ngôi sao trung tâm. Đường kính ~1.39 triệu km. Nhiệt độ bề mặt ~5500°C.'},
    {name:'Sao Thủy',color:0xb1b1b1,size:0.7,dist:12,info:'Hành tinh gần Mặt Trời nhất. Chu kỳ quỹ đạo ~88 ngày.'},
    {name:'Sao Kim',color:0xe7c7a1,size:1.1,dist:16,info:'Bề mặt cực nóng do hiệu ứng nhà kính. Chu kỳ ~225 ngày.'},
    {name:'Trái Đất',color:0x3b82f6,size:1.2,dist:21,info:'Hành tinh có sự sống. Có Mặt Trăng đồng hành.'},
    {name:'Sao Hỏa',color:0xc1440e,size:0.9,dist:27,info:'Hành tinh đỏ. Có hai vệ tinh nhỏ: Phobos và Deimos.'},
    {name:'Sao Mộc',color:0xd4a574,size:3.2,dist:38,info:'Hành tinh lớn nhất. Khí khổng lồ, có đốm đỏ lớn.'},
    {name:'Sao Thổ',color:0xe6d5a8,size:2.8,dist:50,info:'Nổi tiếng với hệ vành đai. Khí khổng lồ.'},
    {name:'Thiên Vương',color:0x7dd3fc,size:1.8,dist:60,info:'Băng khổng lồ, nghiêng trục gần 98°.'},
    {name:'Hải Vương',color:0x2563eb,size:1.7,dist:70,info:'Hành tinh xa nhất. Gió mạnh nhất hệ Mặt Trời.'}
  ];
  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x000000,0.0025);
  const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,500);
  camera.position.set(0,28,55);
  const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;
  const ambient=new THREE.AmbientLight(0x334455,0.55);
  scene.add(ambient);
  const sunLight=new THREE.PointLight(0xfff0c0,2.2,200);
  scene.add(sunLight);
  // stars
  const starGeo=new THREE.BufferGeometry();
  const starPos=new Float32Array(3500*3);
  for(let i=0;i<starPos.length;i++) starPos[i]=(Math.random()-0.5)*400;
  starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
  scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:0.35})));
  const meshes=[];
  const visited=new Set();
  PLANETS.forEach((p,i)=>{
    const geo=new THREE.SphereGeometry(p.size,32,32);
    const mat=new THREE.MeshStandardMaterial({color:p.color,emissive:i===0?p.color:0x000000,emissiveIntensity:i===0?0.7:0,roughness:0.55});
    const m=new THREE.Mesh(geo,mat);
    m.position.x=p.dist;
    m.userData=p;
    scene.add(m);
    meshes.push(m);
    if(p.dist>0){
      const og=new THREE.RingGeometry(p.dist-0.05,p.dist+0.05,128);
      const om=new THREE.MeshBasicMaterial({color:0xffffff,opacity:0.12,transparent:true,side:THREE.DoubleSide});
      const ring=new THREE.Mesh(og,om);
      ring.rotation.x=Math.PI/2;
      scene.add(ring);
    }
    if(p.name==='Sao Thổ'){
      const rg=new THREE.RingGeometry(p.size*1.4,p.size*2.2,64);
      const rm=new THREE.MeshBasicMaterial({color:0xc9b896,opacity:0.65,transparent:true,side:THREE.DoubleSide});
      const r=new THREE.Mesh(rg,rm);
      r.rotation.x=Math.PI/2.4;
      m.add(r);
    }
  });
  // Moon around Earth
  const earth=meshes[3];
  const moon=new THREE.Mesh(new THREE.SphereGeometry(0.28,16,16),new THREE.MeshStandardMaterial({color:0xcccccc}));
  earth.add(moon);
  moon.position.x=2.4;
  const raycaster=new THREE.Raycaster();
  const mouse=new THREE.Vector2();
  const panel=document.getElementById('panel');
  const ptitle=document.getElementById('ptitle');
  const pbody=document.getElementById('pbody');
  const mission=document.getElementById('mission');
  document.getElementById('pclose').onclick=()=>panel.style.display='none';
  function openInfo(p){
    visited.add(p.name);
    mission.textContent='Nhiệm vụ: '+visited.size+'/9'+(visited.size>=9?' — Hoàn thành!':'');
    ptitle.textContent=p.name;
    pbody.textContent=p.info;
    panel.style.display='block';
  }
  renderer.domElement.addEventListener('pointerdown',e=>{
    mouse.x=(e.clientX/innerWidth)*2-1;
    mouse.y=-(e.clientY/innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObjects(meshes);
    if(hits.length) openInfo(hits[0].object.userData);
  });
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  const clock=new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t=clock.getElapsedTime();
    meshes.forEach((m,i)=>{
      if(i===0) return;
      const p=PLANETS[i];
      const speed=0.12/(i+0.5);
      m.position.x=Math.cos(t*speed)*p.dist;
      m.position.z=Math.sin(t*speed)*p.dist;
      m.rotation.y+=0.005;
    });
    moon.rotation.y+=0.02;
    controls.update();
    renderer.render(scene,camera);
  }
  animate();
})();
</script>
</body>
</html>
