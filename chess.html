<body style="margin:0;background:#060913;color:#e8eef8;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh">
<div id="msg">Đang tải cờ vua…</div>
<script>
(function(){
  var url = "https://raw.githubusercontent.com/lethithuong902-create/hardwin-solar/f64a468aa60db864e4114bd5d96780bc44c03a8e/chess.html";
  fetch(url)
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(function(html){
      var d = document.open("text/html", "replace");
      d.write(html);
      d.close();
    })
    .catch(function(e){
      document.getElementById("msg").innerHTML = "Lỗi tải: "+e+"<br><br><a href=\"/\" style=\"color:#38bdf8\">← Hardwin</a>";
    });
})();
</script>
