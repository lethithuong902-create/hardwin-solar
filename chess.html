<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hardwin · Cờ vua</title>
<link rel="icon" href="/favicon.png?v=6" type="image/png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
:root{
  --bg:#060913;--card:rgba(13,20,38,.95);--text:#e8eef8;--muted:#8fa3c2;
  --accent:#fbbf24;--accent2:#38bdf8;--border:rgba(148,163,184,.28);
  --light:#e8edf5;--dark:#4a6fa5;--sel:#fbbf24;--last:#38bdf855;--legal:#4ade8088;
  --danger:#f87171;--ok:#4ade80;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:radial-gradient(ellipse at top,#0f1a2e 0%,#060913 60%);color:var(--text);font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.back{position:fixed;left:12px;top:12px;z-index:50;font:700 13px system-ui;color:var(--accent2);text-decoration:none;background:rgba(8,14,28,.95);padding:10px 14px;border-radius:10px;border:1px solid rgba(56,189,248,.4)}
.wrap{max-width:560px;margin:0 auto;padding:56px 12px 24px;min-height:100%}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand img{width:44px;height:44px;border-radius:50%;border:2px solid rgba(56,189,248,.5)}
.brand .tag{font-size:10px;letter-spacing:.22em;color:var(--accent2);font-weight:700}
.brand h1{font-size:clamp(18px,4.5vw,24px);margin-top:2px}
#menuScreen,#gameScreen{display:none}
#menuScreen.show,#gameScreen.show{display:block}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
.panel h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-btn,.diff-btn{padding:14px 12px;border-radius:12px;border:1px solid var(--border);background:rgba(30,41,59,.7);color:var(--text);font:600 14px system-ui;cursor:pointer;text-align:left;transition:.15s}
.mode-btn:hover,.diff-btn:hover{border-color:var(--accent2)}
.mode-btn.on,.diff-btn.on{border-color:var(--accent2);background:rgba(56,189,248,.18)}
.mode-btn .sub,.diff-btn .sub{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:4px}
.diff-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#startBtn{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#0b1220;font:800 16px system-ui;cursor:pointer;margin-top:8px}
#startBtn:disabled{opacity:.4;cursor:not-allowed}
.board-wrap{position:relative;width:100%;max-width:min(100vw - 24px,480px);margin:0 auto;aspect-ratio:1;border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45);border:2px solid rgba(148,163,184,.25)}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%;user-select:none}
.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(28px,8vw,48px);cursor:pointer;position:relative;transition:background .1s}
.sq.light{background:var(--light)}
.sq.dark{background:var(--dark)}
.sq.sel{outline:3px solid var(--sel);outline-offset:-3px;z-index:2}
.sq.last{background:var(--last)!important}
.sq.legal::after{content:'';width:28%;height:28%;border-radius:50%;background:var(--legal);position:absolute}
.sq.legal.has::after{width:88%;height:88%;border-radius:8px;background:transparent;border:3px solid var(--legal)}
.sq.check{box-shadow:inset 0 0 0 4px var(--danger)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 10px;flex-wrap:wrap}
.status{font:600 14px system-ui;padding:8px 14px;border-radius:10px;background:rgba(13,20,38,.9);border:1px solid var(--border)}
.status.turn-w{border-color:rgba(251,191,36,.5)}
.status.turn-b{border-color:rgba(56,189,248,.5)}
.status.over{border-color:var(--ok);color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(30,41,59,.85);color:var(--text);font:600 13px system-ui;cursor:pointer}
.actions button:hover{border-color:var(--accent2)}
.actions button.danger{border-color:rgba(248,113,113,.5);color:#fca5a5}
.moves{max-height:120px;overflow:auto;font:13px/1.5 ui-monospace,monospace;color:var(--muted);padding:10px 12px;background:rgba(8,14,28,.7);border-radius:10px;border:1px solid var(--border);margin-top:10px}
.promo{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:none;align-items:center;justify-content:center}
.promo.show{display:flex}
.promo-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;display:flex;gap:12px}
.promo-box button{width:64px;height:64px;font-size:36px;border-radius:12px;border:1px solid var(--border);background:rgba(30,41,59,.9);cursor:pointer}
.promo-box button:hover{border-color:var(--accent2);background:rgba(56,189,248,.2)}
.thinking{font-size:13px;color:var(--accent2);margin-top:6px;min-height:18px}
.help{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<a class="back" href="/">← Hardwin</a>
<div class="wrap">
  <div class="brand">
    <img src="/favicon.png?v=6" alt="H">
    <div>
      <div class="tag">HARDWIN</div>
      <h1>♟️ Cờ vua</h1>
    </div>
  </div>

  <div id="menuScreen" class="show">
    <div class="panel">
      <h3>Chế độ chơi</h3>
      <div class="mode-grid">
        <button type="button" class="mode-btn on" data-mode="pvp">
          👥 Chơi với bạn
          <span class="sub">Hai người trên cùng máy</span>
        </button>
        <button type="button" class="mode-btn" data-mode="ai">
          🤖 Chơi với máy
          <span class="sub">AI 3 cấp độ</span>
        </button>
      </div>
    </div>
    <div class="panel" id="diffPanel" style="display:none">
      <h3>Cấp độ máy</h3>
      <div class="diff-row">
        <button type="button" class="diff-btn on" data-diff="easy">Dễ<span class="sub">Mới học</span></button>
        <button type="button" class="diff-btn" data-diff="medium">TB<span class="sub">Vừa sức</span></button>
        <button type="button" class="diff-btn" data-diff="hard">Khó<span class="sub">Thách thức</span></button>
      </div>
      <p class="help" style="margin-top:12px">Bạn cầm quân trắng. Máy cầm đen. Không giới hạn thời gian.</p>
    </div>
    <button type="button" id="startBtn">Bắt đầu ván cờ</button>
    <p class="help">Không đồng hồ · Chơi thoải mái · Ăn tốt, phong tốt, chiếu hết đầy đủ luật.</p>
  </div>

  <div id="gameScreen">
    <div class="hud">
      <div class="status" id="status">Lượt trắng</div>
      <div class="actions">
        <button type="button" id="btnUndo">↩ Hoàn tác</button>
        <button type="button" id="btnFlip">⇅ Lật bàn</button>
        <button type="button" id="btnNew" class="danger">Ván mới</button>
      </div>
    </div>
    <div class="thinking" id="thinking"></div>
    <div class="board-wrap"><div id="board"></div></div>
    <div class="moves" id="moves"></div>
  </div>
</div>

<div class="promo" id="promo">
  <div class="promo-box">
    <button type="button" data-p="q">♕</button>
    <button type="button" data-p="r">♖</button>
    <button type="button" data-p="b">♗</button>
    <button type="button" data-p="n">♘</button>
  </div>
</div>

<script>
(function(){
  var PIECES = {
    wK:'♔',wQ:'♕',wR:'♖',wB:'♗',wN:'♘',wP:'♙',
    bK:'♚',bQ:'♛',bR:'♜',bB:'♝',bN:'♞',bP:'♟'
  };
  var game = new Chess();
  var mode = 'pvp';
  var diff = 'easy';
  var selected = null;
  var legal = [];
  var lastMove = null;
  var flipped = false;
  var pendingPromo = null;
  var aiThinking = false;
  var historyStack = [];

  var menuScreen = document.getElementById('menuScreen');
  var gameScreen = document.getElementById('gameScreen');
  var boardEl = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var movesEl = document.getElementById('moves');
  var thinkingEl = document.getElementById('thinking');
  var promoEl = document.getElementById('promo');
  var diffPanel = document.getElementById('diffPanel');

  document.querySelectorAll('.mode-btn').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('.mode-btn').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      mode = b.dataset.mode;
      diffPanel.style.display = mode === 'ai' ? 'block' : 'none';
    };
  });
  document.querySelectorAll('.diff-btn').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('.diff-btn').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      diff = b.dataset.diff;
    };
  });
  document.getElementById('startBtn').onclick = function(){ startGame(); };
  document.getElementById('btnNew').onclick = function(){
    if(confirm('Thoát ván hiện tại và về menu?')){
      menuScreen.classList.add('show');
      gameScreen.classList.remove('show');
    }
  };
  document.getElementById('btnUndo').onclick = undo;
  document.getElementById('btnFlip').onclick = function(){ flipped = !flipped; render(); };
  document.querySelectorAll('#promo button').forEach(function(b){
    b.onclick = function(){
      if(!pendingPromo) return;
      doMove(pendingPromo.from, pendingPromo.to, b.dataset.p);
      pendingPromo = null;
      promoEl.classList.remove('show');
    };
  });

  function startGame(){
    game.reset();
    selected = null;
    legal = [];
    lastMove = null;
    flipped = false;
    historyStack = [];
    aiThinking = false;
    menuScreen.classList.remove('show');
    gameScreen.classList.add('show');
    render();
    updateStatus();
  }

  function sqName(r,c){ return 'abcdefgh'[c] + (8-r); }

  function render(){
    boardEl.innerHTML = '';
    var order = [];
    for(var r=0;r<8;r++) for(var c=0;c<8;c++) order.push({r:r,c:c});
    if(flipped) order.reverse();

    order.forEach(function(pos){
      var r = pos.r, c = pos.c;
      var name = sqName(r,c);
      var sq = document.createElement('div');
      sq.className = 'sq ' + ((r+c)%2===0 ? 'light' : 'dark');
      sq.dataset.sq = name;

      if(lastMove && (name===lastMove.from || name===lastMove.to)) sq.classList.add('last');
      if(selected === name) sq.classList.add('sel');
      if(legal.indexOf(name) >= 0){
        sq.classList.add('legal');
        var p = game.get(name);
        if(p) sq.classList.add('has');
      }

      var piece = game.get(name);
      if(piece){
        var map = {
          'wK':'♔','wQ':'♕','wR':'♖','wB':'♗','wN':'♘','wP':'♙',
          'bK':'♚','bQ':'♛','bR':'♜','bB':'♝','bN':'♞','bP':'♟'
        };
        sq.textContent = map[piece.color + piece.type.toUpperCase()] || '';
      }

      if(game.in_check() && piece && piece.type==='k' && piece.color===game.turn()){
        sq.classList.add('check');
      }

      sq.onclick = function(){ onSquareClick(name); };
      boardEl.appendChild(sq);
    });

    var hist = game.history({verbose:true});
    var txt = '';
    for(var i=0;i<hist.length;i+=2){
      var n = Math.floor(i/2)+1;
      txt += n + '. ' + hist[i].san;
      if(hist[i+1]) txt += ' ' + hist[i+1].san;
      txt += '  ';
    }
    movesEl.textContent = txt || 'Chưa có nước đi';
  }

  function onSquareClick(name){
    if(aiThinking) return;
    if(game.game_over()) return;
    if(mode==='ai' && game.turn()==='b') return;

    var piece = game.get(name);

    if(selected){
      if(legal.indexOf(name) >= 0){
        var fromP = game.get(selected);
        if(fromP && fromP.type==='p' && ((fromP.color==='w' && name[1]==='8') || (fromP.color==='b' && name[1]==='1'))){
          pendingPromo = {from:selected, to:name};
          promoEl.classList.add('show');
          return;
        }
        doMove(selected, name, undefined);
        return;
      }
      if(piece && piece.color === game.turn()){
        selectSquare(name);
        return;
      }
      selected = null;
      legal = [];
      render();
      return;
    }

    if(piece && piece.color === game.turn()){
      selectSquare(name);
    }
  }

  function selectSquare(name){
    selected = name;
    legal = game.moves({square:name, verbose:true}).map(function(m){ return m.to; });
    render();
  }

  function doMove(from, to, promotion){
    var move = game.move({from:from, to:to, promotion: promotion || 'q'});
    if(!move) return;
    lastMove = {from:from, to:to};
    selected = null;
    legal = [];
    historyStack.push(1);
    render();
    updateStatus();
    if(!game.game_over() && mode==='ai' && game.turn()==='b'){
      setTimeout(aiMove, 80);
    }
  }

  function updateStatus(){
    statusEl.className = 'status';
    if(game.in_checkmate()){
      statusEl.textContent = game.turn()==='w' ? 'Chiếu hết — Đen thắng!' : 'Chiếu hết — Trắng thắng!';
      statusEl.classList.add('over');
    } else if(game.in_draw()){
      statusEl.textContent = 'Hòa (' + (game.in_stalemate()?'bế tắc':game.in_threefold_repetition()?'lặp 3 lần':game.insufficient_material()?'thiếu quân':'50 nước') + ')';
      statusEl.classList.add('over');
    } else if(game.in_check()){
      statusEl.textContent = (game.turn()==='w'?'Trắng':'Đen') + ' đang bị chiếu';
      statusEl.classList.add(game.turn()==='w'?'turn-w':'turn-b');
    } else {
      statusEl.textContent = 'Lượt ' + (game.turn()==='w'?'Trắng':'Đen');
      statusEl.classList.add(game.turn()==='w'?'turn-w':'turn-b');
    }
    thinkingEl.textContent = '';
  }

  function undo(){
    if(aiThinking) return;
    if(mode==='ai'){
      game.undo();
      game.undo();
    } else {
      game.undo();
    }
    lastMove = null;
    selected = null;
    legal = [];
    var hist = game.history({verbose:true});
    if(hist.length){
      var m = hist[hist.length-1];
      lastMove = {from:m.from, to:m.to};
    }
    render();
    updateStatus();
  }

  var PIECE_VAL = {p:100, n:320, b:330, r:500, q:900, k:20000};
  var PST = {
    p:[0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
    n:[-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
    b:[-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
    r:[0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
    q:[-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
    k:[-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20]
  };

  function evaluate(g){
    if(g.in_checkmate()) return g.turn()==='w' ? -99999 : 99999;
    if(g.in_draw()) return 0;
    var board = g.board();
    var score = 0;
    for(var r=0;r<8;r++){
      for(var c=0;c<8;c++){
        var p = board[r][c];
        if(!p) continue;
        var v = PIECE_VAL[p.type];
        var pst = PST[p.type];
        var idx = p.color==='w' ? (r*8+c) : ((7-r)*8+c);
        var bonus = pst ? pst[idx] : 0;
        if(p.color==='w') score += v + bonus;
        else score -= v + bonus;
      }
    }
    return score;
  }

  function minimax(g, depth, alpha, beta, maximizing){
    if(depth===0 || g.game_over()) return evaluate(g);
    var moves = g.moves({verbose:true});
    moves.sort(function(a,b){
      var ca = a.captured ? PIECE_VAL[a.captured] : 0;
      var cb = b.captured ? PIECE_VAL[b.captured] : 0;
      return cb - ca;
    });

    if(maximizing){
      var maxEval = -Infinity;
      for(var i=0;i<moves.length;i++){
        g.move(moves[i]);
        var ev = minimax(g, depth-1, alpha, beta, false);
        g.undo();
        if(ev > maxEval) maxEval = ev;
        if(ev > alpha) alpha = ev;
        if(beta <= alpha) break;
      }
      return maxEval;
    } else {
      var minEval = Infinity;
      for(var i=0;i<moves.length;i++){
        g.move(moves[i]);
        var ev = minimax(g, depth-1, alpha, beta, true);
        g.undo();
        if(ev < minEval) minEval = ev;
        if(ev < beta) beta = ev;
        if(beta <= alpha) break;
      }
      return minEval;
    }
  }

  function aiMove(){
    if(game.game_over() || game.turn()!=='b') return;
    aiThinking = true;
    thinkingEl.textContent = 'Máy đang suy nghĩ…';
    statusEl.textContent = 'Máy (Đen) đang đi…';

    setTimeout(function(){
      var depth = diff==='easy' ? 2 : (diff==='medium' ? 3 : 4);
      var moves = game.moves({verbose:true});
      if(!moves.length){ aiThinking=false; updateStatus(); return; }

      if(diff==='easy' && Math.random() < 0.35){
        var m = moves[Math.floor(Math.random()*moves.length)];
        lastMove = {from:m.from, to:m.to};
        game.move(m);
        aiThinking = false;
        render();
        updateStatus();
        return;
      }

      var best = null, bestScore = Infinity;
      for(var i=moves.length-1;i>0;i--){
        var j = Math.floor(Math.random()*(i+1));
        var t = moves[i]; moves[i]=moves[j]; moves[j]=t;
      }

      for(var i=0;i<moves.length;i++){
        game.move(moves[i]);
        var score = minimax(game, depth-1, -Infinity, Infinity, true);
        game.undo();
        if(score < bestScore || (score === bestScore && Math.random()<0.3)){
          bestScore = score;
          best = moves[i];
        }
      }

      if(best){
        lastMove = {from:best.from, to:best.to};
        game.move(best);
      }
      aiThinking = false;
      render();
      updateStatus();
    }, diff==='hard' ? 50 : 120);
  }

  render();
})();
</script>
</body>
</html>
