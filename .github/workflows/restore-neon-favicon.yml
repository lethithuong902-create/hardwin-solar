name: Restore exact Hardwin neon favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-favicon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact new neon logo
        run: |
          curl -L --fail --silent --show-error \
            'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-9864-8209-b0f8-e6096eb9382e/raw?se=2026-10-04T03%3A29%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=c3268172-13bf-4af9-9690-08945b13b328&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T01%3A27%3A13Z&ske=2026-10-05T01%3A27%3A13Z&sks=b&skv=2026-02-06&sig=uyfTMa8Fe1IGQgaPZaNkD03wWng68f5xnV2bTkQxpmI%3D' \
            -o favicon.png

      - name: Validate PNG
        run: |
          file favicon.png
          python - <<'PY'
          from pathlib import Path
          p = Path("favicon.png")
          b = p.read_bytes()
          assert b[:8] == b"\x89PNG\r\n\x1a\n", "Not a PNG file"
          assert b[12:16] == b"IHDR", "Missing PNG IHDR"
          w = int.from_bytes(b[16:20], "big")
          h = int.from_bytes(b[20:24], "big")
          print(f"PNG OK: {w}x{h}, {len(b)} bytes")
          assert w == h, "Favicon must be square"
          assert w >= 64, "Favicon must be at least 64x64"
          PY

      - name: Replace favicon and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.png
          if git diff --cached --quiet; then
            echo "No favicon change needed."
            exit 0
          fi
          git commit -m "Upload exact new Hardwin neon logo as favicon"
          git push
